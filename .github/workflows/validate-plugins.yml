name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node plugins/soft-factory-v2/tests/validate.mjs
      - run: node --check plugins/soft-factory-v2/skills/factory-deliver/scripts/worktrees.mjs
      - run: node --test plugins/soft-factory-v2/tests/worktrees.test.mjs
